<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" aria-label="Parallel train-eval Job Group: trainer writes checkpoints to a shared PVC; evaluator reads them concurrently." class="diag" role="img" viewBox="0 0 1100 460"><style>.diag{font-family:&apos;Waldenburg&apos;,system-ui,-apple-system,sans-serif;color:#04070b;letter-spacing:-.01em}.diag .mono{font-family:&apos;BerkeleyMono&apos;,ui-monospace,Menlo,monospace;font-feature-settings:&quot;zero&quot; 1;letter-spacing:.02em}.diag .role{font-family:&apos;BerkeleyMono&apos;,monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;fill:#5d6a7a}.diag .annot{font-family:&apos;Waldenburg&apos;,sans-serif;font-size:15px;font-weight:400;fill:#5d6a7a}.diag .flow-label{font-family:&apos;BerkeleyMono&apos;,monospace;font-size:13px;letter-spacing:.04em;font-weight:600;fill:#0a55ee;paint-order:stroke;stroke:#fff;stroke-width:6;stroke-linejoin:round}.diag .flow-label.hot{fill:#c7402e}.diag .flow{animation:flow-dash 1.8s linear infinite}</style><g><rect width="380" height="350" x="70" y="60" fill="none" stroke="#0A55EE" stroke-dasharray="2 5" stroke-width="1.5" rx="20"/><g transform="translate(96 60)"><rect width="260" height="32" x="-12" y="-16" fill="#FFF" stroke="#0A55EE" stroke-width="1.25" rx="16"/><text x="0" y="6" fill="#0A55EE" font-family="BerkeleyMono, monospace" font-size="14" font-weight="700" letter-spacing=".18em">SKYPILOT JOB GROUP</text></g></g><g><path fill="#E4F2FB" stroke="#0A55EE" stroke-width="1.5" d="M 730.0 80 L 730.0 390 A 120.0 24 0 0 0 970.0 390 L 970.0 80 A 120.0 24 0 0 1 730.0 80 Z"/><ellipse cx="850" cy="80" fill="#ECF2FD" stroke="#0A55EE" stroke-width="1.5" rx="120" ry="24"/><text x="850" y="223" fill="#062152" font-family="BerkeleyMono, monospace" font-size="22" font-weight="700" text-anchor="middle">/checkpoints</text><text x="850" y="251" fill="#243142" class="annot" text-anchor="middle">Kubernetes PVC · shared volume</text><text x="850" y="277" fill="#5d6a7a" class="mono" font-size="13" text-anchor="middle">my-checkpoint-volume</text></g><g transform="translate(90 80)"><rect width="340" height="140" x="0" y="0" fill="#FFF" stroke="#C7402E" stroke-width="1.5" rx="14"/><text x="22" y="32" class="role">TASK 01</text><text x="22" y="72" fill="#04070B" font-family="Waldenburg, sans-serif" font-size="28" font-weight="500" letter-spacing="-.015em">trainer</text><text x="22" y="100" class="annot">writes a checkpoint every N steps</text></g><g transform="translate(90 250)"><rect width="340" height="140" x="0" y="0" fill="#FFF" stroke="#0A55EE" stroke-width="1.5" rx="14"/><text x="22" y="32" class="role">TASK 02</text><text x="22" y="72" fill="#04070B" font-family="Waldenburg, sans-serif" font-size="28" font-weight="500" letter-spacing="-.015em">evaluator</text><text x="22" y="100" class="annot">polls the volume for new checkpoints</text></g><g><path fill="none" stroke="#C7402E" stroke-dasharray="8 4" stroke-linecap="round" stroke-width="1.5" d="M 438 150.0 Q 582.00 150.00 726.0 150.0" class="flow"/><polyline fill="none" stroke="#C7402E" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="1.5" points="715 156.5 726 150 715 143.5"/><text x="582" y="136" class="flow-label hot" text-anchor="middle">write</text></g><g><path fill="none" stroke="#0A55EE" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="1.5" d="M 726.0 320.0 Q 582.00 320.00 438 320.0" class="flow"/><polyline fill="none" stroke="#0A55EE" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="1.5" points="449 313.5 438 320 449 326.5"/><text x="582" y="306" class="flow-label" text-anchor="middle">read</text></g></svg>