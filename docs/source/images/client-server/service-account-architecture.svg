<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400"><defs><style>.label,.small-label{font:12px sans-serif;text-anchor:middle}.small-label{font:10px sans-serif}.box{fill:none;stroke:#333;stroke-width:2;rx:8}.human-box{fill:#e1f5fe;stroke:#0277bd}.service-box{fill:#f3e5f5;stroke:#7b1fa2}.proxy-box{fill:#fff3e0;stroke:#f57c00}.server-box{fill:#e8f5e8;stroke:#388e3c}.direct-arrow,.proxy-arrow{stroke-width:2;marker-end:url(#arrowhead)}.proxy-arrow{stroke:#0277bd}.direct-arrow{stroke:#7b1fa2}</style><marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="9" refY="3.5"><polygon fill="#333" points="0 0 10 3.5 0 7"/></marker></defs><rect width="100" height="60" x="50" y="80" class="box human-box"/><text x="100" y="105" class="label">👤 Users</text><text x="100" y="125" class="small-label">(Browser)</text><rect width="100" height="60" x="50" y="200" class="box service-box"/><text x="100" y="220" class="label">🤖 Service</text><text x="100" y="235" class="label">Accounts</text><text x="100" y="250" class="small-label">(API Tokens)</text><rect width="100" height="60" x="250" y="80" class="box proxy-box"/><text x="300" y="105" class="label">🔐 Auth</text><text x="300" y="120" class="label">Proxy</text><rect width="120" height="80" x="450" y="140" class="box server-box"/><text x="510" y="170" class="label">⚙️ SkyPilot</text><text x="510" y="185" class="label">API Server</text><line x1="150" x2="250" y1="110" y2="110" class="proxy-arrow"/><text x="200" y="105" class="small-label">Browser Auth</text><line x1="350" x2="450" y1="110" y2="160" class="proxy-arrow"/><text x="400" y="130" class="small-label">Headers</text><line x1="150" x2="450" y1="230" y2="200" class="direct-arrow"/><text x="270" y="210" class="small-label">Direct Token Auth</text></svg>