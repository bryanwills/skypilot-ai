<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" aria-label="What runs when on a Sky Batch worker: the pool's setup command runs once at pool creation, the mapper code before the for-loop runs once per worker per job, and the loop body — load, your code, save_results — repeats for every batch." class="diag" role="img" viewBox="0 0 1280 380"><style>.diag{font-family:&apos;Waldenburg&apos;,system-ui,-apple-system,sans-serif;color:#04070b;letter-spacing:-.01em}.diag .eyebrow,.diag .role{font-family:&apos;BerkeleyMono&apos;,monospace;text-transform:uppercase;fill:#5d6a7a}.diag .eyebrow{font-size:12px;letter-spacing:.18em;font-feature-settings:&quot;zero&quot; 1}.diag .role{font-size:11.5px;letter-spacing:.14em}.diag .annot,.diag .task-name{font-family:&apos;Waldenburg&apos;,sans-serif}.diag .task-name{font-size:20px;font-weight:500;letter-spacing:-.015em;fill:#04070b}.diag .annot{font-size:13.5px;font-weight:400;fill:#5d6a7a}.diag .flow-label{font-family:&apos;BerkeleyMono&apos;,monospace;font-size:13px;letter-spacing:.04em;font-weight:600;fill:#0a55ee;paint-order:stroke;stroke:#fcfcfb;stroke-width:6;stroke-linejoin:round}.diag .flow-label.hot{fill:#c7402e}.diag .flow{animation:flow-dash 1.8s linear infinite}</style><rect width="1280" height="380" x="0" y="0" fill="#FCFCFB" rx="20"/><g transform="translate(40 115)"><rect width="230" height="120" x="0" y="0" fill="#FFF" stroke="#C8C6C7" stroke-width="1" rx="12"/><text x="16" y="26" class="role">pool setup</text><text x="16" y="56" class="task-name">setup:</text><text x="16" y="82" fill="#243142" font-family="BerkeleyMono, monospace" font-size="12">pip install vllm</text><text x="16" y="104" class="annot" font-size="13">runs once, at pool creation</text></g><g transform="translate(310 115)"><rect width="230" height="120" x="0" y="0" fill="#ECF2FD" stroke="#0A55EE" stroke-width="1.5" rx="12"/><text x="16" y="26" class="role">mapper prologue</text><text x="16" y="56" class="task-name">before the loop</text><text x="16" y="82" fill="#243142" font-family="BerkeleyMono, monospace" font-size="12">model = pipeline(…)</text><text x="16" y="104" class="annot" font-size="13">runs once per worker, per job</text></g><g><rect width="650" height="230" x="590" y="70" fill="none" stroke="#C7402E" stroke-dasharray="2 5" stroke-width="1.5" rx="20"/><g transform="translate(616 70)"><rect width="238" height="32" x="-12" y="-16" fill="#FCFCFB" stroke="#C7402E" stroke-width="1.25" rx="16"/><text x="0" y="6" fill="#C7402E" font-family="BerkeleyMono, monospace" font-size="14" font-weight="700" letter-spacing=".18em">FOR EVERY BATCH</text></g></g><g transform="translate(610 130)"><rect width="190" height="90" x="0" y="0" fill="#FFF" stroke="#C8C6C7" stroke-width="1" rx="12"/><text x="95" y="40" fill="#04070B" font-family="BerkeleyMono, monospace" font-size="13" font-weight="600" text-anchor="middle">sky.batch.load()</text><text x="95" y="64" class="annot" text-anchor="middle">yields the next batch</text></g><g transform="translate(820 130)"><rect width="190" height="90" x="0" y="0" fill="#FBEEEB" stroke="#C7402E" stroke-width="1.5" rx="12"/><text x="95" y="40" fill="#04070B" font-family="BerkeleyMono, monospace" font-size="13" font-weight="600" text-anchor="middle">your code</text><text x="95" y="64" class="annot" text-anchor="middle">GPU work on the batch</text></g><g transform="translate(1030 130)"><rect width="190" height="90" x="0" y="0" fill="#FFF" stroke="#C8C6C7" stroke-width="1" rx="12"/><text x="95" y="40" fill="#04070B" font-family="BerkeleyMono, monospace" font-size="13" font-weight="600" text-anchor="middle">save_results()</text><text x="95" y="64" class="annot" text-anchor="middle">one dict per input item</text></g><g><path fill="none" stroke="#0A55EE" stroke-dasharray="8 4" stroke-linecap="round" stroke-width="1.5" d="M 270 175 L 306 175" class="flow"/><polyline fill="none" stroke="#0A55EE" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="1.5" points="295 181.5 306 175 295 168.5"/></g><g><path fill="none" stroke="#0A55EE" stroke-dasharray="8 4" stroke-linecap="round" stroke-width="1.5" d="M 540 175 L 588 175" class="flow"/><polyline fill="none" stroke="#0A55EE" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="1.5" points="577 181.5 588 175 577 168.5"/></g><g><path fill="none" stroke="#C7402E" stroke-linecap="round" stroke-width="1.5" d="M 800 175 L 818 175"/><polyline fill="none" stroke="#C7402E" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="1.5" points="809 181.5 818 175 809 168.5"/></g><g><path fill="none" stroke="#C7402E" stroke-linecap="round" stroke-width="1.5" d="M 1010 175 L 1028 175"/><polyline fill="none" stroke="#C7402E" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="1.5" points="1019 181.5 1028 175 1019 168.5"/></g><g><path fill="none" stroke="#C7402E" stroke-dasharray="6 5" stroke-linecap="round" stroke-width="1.5" d="M 1125 220 L 1125 262 Q 1125 272 1115 272 L 715 272 Q 705 272 705 262 L 705 226" class="flow"/><polyline fill="none" stroke="#C7402E" stroke-linecap="round" stroke-linejoin="bevel" stroke-width="1.5" points="698.5 237 705 226 711.5 237"/><text x="915" y="264" class="flow-label hot" text-anchor="middle">next batch ↺</text></g><g><text x="0" y="0" class="eyebrow" transform="translate(40 336)">WHY IT MATTERS</text><text x="0" y="26" fill="#243142" class="annot" font-size="14" transform="translate(40 336)">Model weights are loaded once and reused for every batch — not once per item, and not once per batch.</text></g></svg>